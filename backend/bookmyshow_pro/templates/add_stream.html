<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stream | BookMyShow Admin</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:18px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        .card-header{
            background:#dc3545;
            color:white;
            border-radius:18px 18px 0 0 !important;
        }

        .form-control{
            height:48px;
        }

        textarea{
            resize:none;
        }

        .btn-save{
            background:#dc3545;
            color:white;
            font-weight:600;
            padding:12px;
        }

        .btn-save:hover{
            background:#bb2d3b;
            color:white;
        }

        h3{
            font-weight:700;
        }

    </style>

</head>
<body>

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-10">

<div class="card">

<div class="card-header py-3">

<h3 class="mb-0">
🎬 Add New Stream
</h3>

</div>

<div class="card-body p-4">

<form method="POST">

{% csrf_token %}

<div class="row">

<div class="col-md-6 mb-4">

<label class="form-label">
Stream Title
</label>

<input
type="text"
name="title"
class="form-control"
placeholder="Enter Stream Name"
required>

</div>

<label>Stream Type</label>

<select name="streamtype" class="form-control">

    {% for st in streamtypes %}

        <option value="{{ st.id }}">
            {{ st.name }}
        </option>

    {% endfor %}

</select>

<div class="col-md-6 mb-4">

<label class="form-label">
Language
</label>

<select
name="language"
class="form-select"
required>

<option>Hindi</option>
<option>English</option>
<option>Gujarati</option>
<option>Tamil</option>
<option>Telugu</option>
<option>Kannada</option>
<option>Malayalam</option>

</select>

</div>

<div class="col-md-6 mb-4">

<div class="col-12 mb-4">

<!-- <label class="form-label fw-bold">
Genres
</label>

<div class="row">

{% for g in genres %}

<div class="col-md-3">

<div class="form-check">

<input
class="form-check-input"
type="checkbox"
name="genre"
value="{{ g.id }}"
id="genre{{g.id}}">

<label
class="form-check-label"
for="genre{{g.id}}">

{{ g.name }}

</label>

</div>

</div>

{% endfor %}

</div> -->

</div>

<div class="col-md-6 mb-4">

<label class="form-label">
Duration
</label>

<input
type="text"
name="duration"
class="form-control"
placeholder="3h 05m"
required>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">
Certificate
</label>

<select
name="certificate"
class="form-select">

<option>U</option>
<option>UA</option>
<option>A</option>

</select>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">
Release Date
</label>

<input
type="date"
name="release_date"
class="form-control"
required>

</div>

<div class="col-md-6 mb-4">

<label class="form-label">
Interested Count
</label>

<input
type="number"
name="interested"
class="form-control"
placeholder="72500"
required>

</div>

<!-- <div class="col-md-6 mb-4">

<label class="form-label">
Trailer URL
</label>

<input
type="url"
name="trailer"
class="form-control"
placeholder="https://youtube.com/..."
>

</div> -->

<div class="col-12 mb-4">

<label class="form-label">
Poster Image URL
</label>

<input
type="url"
name="poster"
class="form-control"
placeholder="https://image.jpg"
required>

</div>

<div class="col-12 mb-4">

<label class="form-label">
Rent
</label>

<input
type="number"
name="rent"
class="form-control"
required>

</div>

</div>

<div class="text-end">

<button
type="submit"
class="btn btn-save px-5">

Add Stream

</button>

</div>

</form>

</div>

</div>

</div>

</div>

</div>

</body>
</html>
